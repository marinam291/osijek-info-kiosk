server:
    build: ./server
    container_name: kiosk_server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - DB_HOST=database
      - CHOKIDAR_USEPOLLING=true  
      - WATCHPACK_POLLING=true    
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - database
    restart: always

  client:
    build: ./client
    container_name: kiosk_client
    ports:
      - "8081:8081"
    environment:                  
      - CHOKIDAR_USEPOLLING=true  
      - WATCHPACK_POLLING=true     
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    restart: always